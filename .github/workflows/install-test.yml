name: install-test

# Free on this public repo (standard GitHub-hosted runners, incl. macOS).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast, cheap checks: the settings-merge unit test + the no-op flags.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: settings-merge smoke test
        run: bash tests/install_test.sh
      - name: --check / --help make no changes and exit 0
        run: |
          bash install.sh --check
          bash install.sh --help

  # The real thing: on a clean macOS runner, run the FULL installer so the
  # dependency-install + build + dedicated-bin (~/.smart-rg/bin) + Claude-config
  # paths actually execute (the branches we can't easily exercise on a dev box that already
  # has everything). The runner has Homebrew + Rust preinstalled; ast-grep is
  # typically absent, so the `brew install ast-grep` branch gets tested.
  macos-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: settings-merge smoke test
        run: bash tests/install_test.sh
      - name: preview deps (no changes)
        run: bash install.sh --check
      - name: full install (deps + build + symlink + Claude config)
        run: bash install.sh
      - name: verify the install produced a working tool
        run: |
          set -euo pipefail
          test -x "$HOME/.smart-rg/bin/rg"          # shim binary in the dedicated dir
          test -L "$HOME/.smart-rg/bin/rg2"         # real-rg symlink created
          test -L "$HOME/.smart-rg/bin/smart-rg"    # smart-rg command created
          test -f "$HOME/.smart-rg/env.sh"          # PATH drop-in written
          "$HOME/.smart-rg/bin/rg" stats            # shim runs without error
          "$HOME/.smart-rg/bin/smart-rg" stats      # smart-rg command runs without error
          command -v ast-grep                       # runtime dep present
          python3 -c "import json,os; \
            d=json.load(open(os.path.expanduser('~/.claude/settings.json'))); \
            assert d['env']['USE_BUILTIN_RIPGREP']=='0', d"
      # Every CI run before this installed exactly once, on a clean runner —
      # so the upgrade path, which is what every real user hits on every
      # release, was never exercised. Install again over the top and assert the
      # layout survives and nothing is duplicated.
      - name: re-install over an existing install (the upgrade path)
        run: |
          set -euo pipefail
          before="$("$HOME/.smart-rg/bin/smart-rg" --version)"
          bash install.sh
          after="$("$HOME/.smart-rg/bin/smart-rg" --version)"
          [ "$before" = "$after" ] || { echo "version changed: $before -> $after"; exit 1; }

          # Layout must be identical to a first install, not degraded.
          test -f "$HOME/.smart-rg/bin/rg"           # real file, not a symlink
          test ! -L "$HOME/.smart-rg/bin/rg"
          test -x "$HOME/.smart-rg/bin/rg"
          test -L "$HOME/.smart-rg/bin/smart-rg"     # still a symlink...
          [ "$(readlink "$HOME/.smart-rg/bin/smart-rg")" = "rg" ]  # ...still RELATIVE
          test -L "$HOME/.smart-rg/bin/rg2"

          # Both entry points still work, and rg still impersonates ripgrep.
          "$HOME/.smart-rg/bin/smart-rg" stats >/dev/null
          "$HOME/.smart-rg/bin/rg" --version | grep -q '^ripgrep '

          # Staging dirs are cleaned up; none may survive a successful install.
          ! ls -a "$HOME/.smart-rg/bin" | grep -q '^\.stage\.'

          # Re-running must not append a second PATH block to the shell rc.
          for f in "$HOME/.zshrc" "$HOME/.bashrc" "$HOME/.bash_profile"; do
            [ -f "$f" ] || continue
            n="$(grep -cF '# >>> smart-rg >>>' "$f" || true)"
            [ "$n" -le 1 ] || { echo "$f has $n smart-rg blocks after re-install"; exit 1; }
          done
          echo "re-install clean ✓"

      - name: uninstall removes everything cleanly
        run: |
          set -euo pipefail
          bash install.sh --uninstall --purge
          test ! -e "$HOME/.smart-rg/bin/rg"        # shim gone
          test ! -e "$HOME/.smart-rg/bin/rg2"       # symlink gone
          test ! -e "$HOME/.smart-rg/bin/smart-rg"  # smart-rg command gone
          test ! -e "$HOME/.smart-rg/env.sh"        # PATH drop-in gone
          test ! -e "$HOME/.smart-rg"               # data dir purged, no orphans
          echo "uninstall clean ✓"
